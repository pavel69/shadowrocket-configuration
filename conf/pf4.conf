# https://manual.nssurge.com/dns/doh.html

[General]
tun-excluded-routes = 10.0.0.0/8,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.0.2.0/24,192.88.99.0/24,192.168.0.0/16,198.51.100.0/24,203.0.113.0/24,224.0.0.0/4,255.255.255.255/32,10.27.0.0/16,195.133.244.118/32

bypass-system = true

ipv6 = false
prefer-ipv6 = false

private-ip-answer = true

dns-direct-system = true

dns-direct-fallback-proxy = false
dns-server = https://dns.adguard-dns.com/dns-query
fallback-dns-server = https://1.1.1.1/dns-query

hijack-dns = 8.8.8.8:53,1.1.1.1:53

# tun-included-routes = 

# always-real-ip = 

icmp-auto-reply = false
always-reject-url-rewrite = false

block-quic = always-allow
udp-policy-not-supported-behaviour = REJECT
allow-dns-svcb = true
allow-dns-all = true
compatibility-mode = 3

update-url = https://raw.githubusercontent.com/pavel69/shadowrocket-configuration/refs/heads/release/conf/pf4.conf

[Rule]

RULE-SET,https://raw.githubusercontent.com/pavel69/shadowrocket-configuration/release/rules/pf/ip_test.list,PROXY

RULE-SET,https://raw.githubusercontent.com/misha-tgshv/shadowrocket-configuration-file/main/rules/voice_ports.list,PROXY

RULE-SET,https://github.com/toneywhitez/zkeen_rules/releases/latest/download/youtube.list,PROXY
RULE-SET,https://github.com/toneywhitez/zkeen_rules/releases/latest/download/youtube_ips.list,PROXY,no-resolve
RULE-SET,https://github.com/toneywhitez/zkeen_rules/releases/latest/download/telegram_ips.list,PROXY,no-resolve
RULE-SET,https://github.com/toneywhitez/zkeen_rules/releases/latest/download/meta_ips.list,PROXY,no-resolve

RULE-SET,https://raw.githubusercontent.com/misha-tgshv/shadowrocket-configuration-file/main/rules/domains_community.list,PROXY
RULE-SET,https://raw.githubusercontent.com/misha-tgshv/shadowrocket-configuration-file/main/rules/domain_ips.list,DE,no-resolve

RULE-SET,https://raw.githubusercontent.com/HybridNetworks/whatsapp-cidr/main/WhatsApp/whatsapp_cidr_ipv4.list,PROXY,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Telegram/Telegram.list,PROXY

FINAL,DIRECT
