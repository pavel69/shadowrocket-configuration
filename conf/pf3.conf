# https://manual.nssurge.com/dns/doh.html

[General]
tun-excluded-routes = 10.0.0.0/8,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.0.2.0/24,192.88.99.0/24,192.168.0.0/16,198.51.100.0/24,203.0.113.0/24,224.0.0.0/4,255.255.255.255/32,192.1.1.0/24

bypass-system = true

ipv6 = false
prefer-ipv6 = false

private-ip-answer = true

dns-direct-system = false

dns-direct-fallback-proxy = true

dns-server = https://94.140.14.14/dns-query
fallback-dns-server = https://1.1.1.1/dns-query

hijack-dns = :53

# tun-included-routes = 

# always-real-ip = *

icmp-auto-reply = false
always-reject-url-rewrite = false

block-quic = always-allow
udp-policy-not-supported-behaviour = REJECT
allow-dns-svcb = true
allow-dns-all = true
compatibility-mode = 3

update-url = https://raw.githubusercontent.com/pavel69/shadowrocket-configuration/refs/heads/release/conf/pf3.conf

[Proxy Group]
G1 = fallback,IT,NL,DE,DE2,policy-select-name=FI,interval=600,timeout=5,url=https://cp.cloudflare.com/generate_204,policy-regex-filter=*
DE_GROUP = url-test,DE,DE2,policy-select-name=FI,interval=600,timeout=5,url=https://cp.cloudflare.com/generate_204,policy-regex-filter=*

[Rule]

# DST-PORT,3478-3497,G1
# DST-PORT,16384-16402,G1

# DOMAIN-SUFFIX,browserleaks.com,G1
# DOMAIN,quic.browserleaks.com,G1
# AND,((PROTOCOL,UDP),(DST-PORT,443)),G1

# IP-CIDR,17.0.0.0/8,DE_GROUP,no-resolve


RULE-SET,https://raw.githubusercontent.com/pavel69/shadowrocket-configuration/release/rules/pf/direct.list,DIRECT
# RULE-SET,https://raw.githubusercontent.com/pavel69/shadowrocket-configuration/release/rules/pf/FaceTime-Ports.list,PROXY
RULE-SET,https://raw.githubusercontent.com/pavel69/shadowrocket-configuration/release/rules/pf/ip_test.list,PROXY
RULE-SET,https://raw.githubusercontent.com/pavel69/shadowrocket-configuration/release/rules/pf/proxy-NL.list,NL
RULE-SET,https://raw.githubusercontent.com/pavel69/shadowrocket-configuration/release/rules/pf/proxy.list,G1

RULE-SET,https://raw.githubusercontent.com/misha-tgshv/shadowrocket-configuration-file/main/rules/voice_ports.list,G1

RULE-SET,https://github.com/toneywhitez/zkeen_rules/releases/latest/download/youtube.list,DE_GROUP
RULE-SET,https://github.com/toneywhitez/zkeen_rules/releases/latest/download/youtube_ips.list,DE_GROUP,no-resolve
RULE-SET,https://github.com/toneywhitez/zkeen_rules/releases/latest/download/telegram_ips.list,G1,no-resolve
RULE-SET,https://github.com/toneywhitez/zkeen_rules/releases/latest/download/meta_ips.list,G1,no-resolve

RULE-SET,https://raw.githubusercontent.com/misha-tgshv/shadowrocket-configuration-file/main/rules/domains_community.list,DE_GROUP
RULE-SET,https://raw.githubusercontent.com/misha-tgshv/shadowrocket-configuration-file/main/rules/domain_ips.list,DE,no-resolve

RULE-SET,https://raw.githubusercontent.com/HybridNetworks/whatsapp-cidr/main/WhatsApp/whatsapp_cidr_ipv4.list,G1,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Telegram/Telegram.list,G1

FINAL,DIRECT
